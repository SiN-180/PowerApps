  Y: =10\r\n            Width: =600\r\n            Height: =32\r\n      - lblHeaderSub:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: =\"Create or update contact groups from a pasted list of names and email addresses\"\r\n            Color: =RGBA(214,232,227,1)\r\n            Size: =12\r\n            Font: =Font.'Open Sans'\r\n            X: =52\r\n            Y: =44\r\n            Width: =800\r\n            Height: =22\r\n      - lblImpStep1:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: =\"1. Paste your list\"\r\n            Color: =RGBA(0,78,66,1)\r\n            FontWeight: =FontWeight.Bold\r\n            Size: =16\r\n            Font: =Font.'Open Sans'\r\n            X: =20\r\n            Y: =88\r\n            Width: =560\r\n            Height: =26\r\n      - lblImpHelp:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: =\"Paste straight from Outlook or Excel. A line ending in a colon (for example NAL:) starts a new list. Each entry is a name followed by an email address, separated by semicolons or new lines.\"\r\n            Color: =RGBA(96,105,103,1)\r\n            Size: =11\r\n            Font: =Font.'Open Sans'\r\n            X: =20\r\n            Y: =116\r\n            Width: =560\r\n            Height: =54\r\n      - txtImportPaste:\r\n          Control: Classic/TextInput@2.3.2\r\n          Properties:\r\n            HintText: =\"Paste your list here\"\r\n            Mode: =TextMode.MultiLine\r\n            Font: =Font.'Open Sans'\r\n            Size: =12\r\n            BorderColor: =RGBA(190,201,197,1)\r\n            HoverBorderColor: =RGBA(0,78,66,1)\r\n            PressedBorderColor: =RGBA(0,78,66,1)\r\n            FocusedBorderColor: =RGBA(0,78,66,1)\r\n            X: =20\r\n            Y: =176\r\n            Width: =560\r\n            Height: =280\r\n      - btnImpCheck:\r\n          Control: ModernButton@1.0.0\r\n          Properties:\r\n            Text: =\"Check paste\"\r\n            BasePaletteColor: =RGBA(0,78,66,1)\r\n            OnSelect: |-\r\n              =Set(varImpArmed, false);\r\n              Clear(colImpResults);\r\n              With(\r\n                  {\r\n                      lines: With(\r\n                          {raw: Split(Substitute(Substitute(txtImportPaste.Text, Char(13), \"\"), Char(160), \" \"), Char(10))},\r\n                          ForAll(Sequence(CountRows(raw)) As s, {Idx: s.Value, Line: Trim(Index(raw, s.Value).Value)})\r\n                      )\r\n                  },\r\n                  With(\r\n                      {\r\n                          heads: ForAll(\r\n                              Filter(lines, !IsBlank(Line) && Right(Line, 1) = \":\" && !(\"@\" in Line) && Len(Line) <= 40) As h,\r\n                              {HIdx: h.Idx, Tag: Trim(Left(h.Line, Len(h.Line) - 1))}\r\n                          )\r\n                      },\r\n                      ClearCollect(\r\n                          colImpParsed,\r\n                          ForAll(\r\n                              Ungroup(\r\n                                  ForAll(\r\n                                      Filter(lines, !IsBlank(Line) && !(Right(Line, 1) = \":\" && !(\"@\" in Line) && Len(Line) <= 40)) As ln,\r\n                                      {\r\n                                          Tag: If(CountRows(Filter(heads, HIdx < ln.Idx)) = 0, \"Pasted list\", Last(Filter(heads, HIdx < ln.Idx)).Tag),\r\n                                          Segs: Filter(Split(ln.Line, \";\"), !IsBlank(Trim(Value)))\r\n                                      }\r\n                                  ),\r\n                                  Segs\r\n                              ) As sg,\r\n                              With(\r\n                                  {seg: Trim(sg.Value), em: Last(MatchAll(Trim(sg.Value), \"[A-Za-z0-9._%+'\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}\")).FullMatch},\r\n      Clear(colImpParsed);\r\n              Clear(colImpClean);\r\n              Clear(colImpTags);\r\n              Clear(colImpResults);\r\n              Set(varImpArmed, false);\r\n              Reset(txtImpTitle1);\r\n              Reset(txtImpTitle2);\r\n              Reset(txtImpTitle3);\r\n              Reset(txtImpTitle4);\r\n              Reset(txtImpTitle5);\r\n              Reset(txtImpTitle6)\r\n            X: =204\r\n            Y: =470\r\n            Width: =110\r\n            Height: =42\r\n      - lblImpSummary:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: |-\r\n              =If(\r\n                  CountRows(colImpParsed) = 0,\r\n                  \"Nothing checked yet. Paste your list, then press Check paste.\",\r\n                  With(\r\n                      {\r\n                          found: CountRows(colImpClean),\r\n                          lists: CountRows(colImpTags),\r\n                          skipped: CountRows(Filter(colImpParsed, IsBlank(Email))),\r\n                          dupes: CountRows(Filter(colImpParsed, !IsBlank(Email))) - CountRows(colImpClean),\r\n                          other: CountRows(Filter(colImpClean, !IsApprovedAddress(Email)))\r\n                      },\r\n                      found & \" address\" & If(found = 1, \"\", \"es\") & \" found in \" & lists & \" list\" & If(lists = 1, \"\", \"s\") & \".\" &\r\n                      If(dupes > 0, \"  \" & dupes & \" repeated address\" & If(dupes = 1, \"\", \"es\") & \" ignored.\", \"\") &\r\n                      If(skipped > 0, \"  \" & skipped & \" entr\" & If(skipped = 1, \"y\", \"ies\") & \" had no email address.\", \"\") &\r\n                      If(other > 0, \"  \" & other & \" are not on an approved domain (they are still imported).\", \"\")\r\n                  )\r\n              )\r\n            Color: =RGBA(24,45,55,1)\r\n            Size: =12\r\n            Font: =Font.'Open Sans'\r\n            X: =20\r\n            Y: =522\r\n            Width: =560\r\n            Height: =64\r\n      - lblImpSkippedHead:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: =\"Could not read these (no email address found):\"\r\n            Visible: =CountRows(Filter(colImpParsed, IsBlank(Email))) > 0\r\n            Color: =RGBA(163,45,45,1)\r\n            FontWeight: =FontWeight.Bold\r\n            Size: =11\r\n            Font: =Font.'Open Sans'\r\n            X: =20\r\n            Y: =592\r\n            Width: =560\r\n            Height: =22\r\n      - galImpSkipped:\r\n          Control: Gallery@2.15.0\r\n          Variant: Vertical\r\n          Properties:\r\n            Items: =Filter(colImpParsed, IsBlank(Email))\r\n            Visible: =CountRows(Filter(colImpParsed, IsBlank(Email))) > 0\r\n            TemplateSize: =28\r\n            TemplatePadding: =0\r\n            X: =20\r\n            Y: =616\r\n            Width: =560\r\n            Height: =120\r\n          Children:\r\n            - lblSkippedLine:\r\n                Control: Label@2.5.1\r\n                Properties:\r\n                  Text: =ThisItem.Name\r\n                  Wrap: =false\r\n                  Color: =RGBA(96,105,103,1)\r\n                  Size: =11\r\n                  Font: =Font.'Open Sans'\r\n                  X: =0\r\n                  Y: =2\r\n                  Width: =540\r\n                  Height: =24\r\n      - lblImpStep2:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: =\"2. Name each list and choose what to do\"\r\n            Color: =RGBA(0,78,66,1)\r\n            FontWeight: =FontWeight.Bold\r\n            Size: =16\r\n            Font: =Font.'Open Sans'\r\n            X: =610\r\n            Y: =88\r\n            Width: =736\r\n            Height: =26\r\n      - btnImpModeAdd:\r\n          Control: Classic/Button@2.2.0\r\n          Properties:\r\n            Text: =\"Add only\"\r\n            Fill: =If(varImpMode = \"add\", RGBA(0,78,66,1), RGBA(232,237,235,1))\r\n            HoverFill: =If(varImpMode = \"add\", RGBA(0,78,66,1), RGBA(222,229,226,1))\r\n            PressedFill: =Self.HoverFill\r\n            Color: =If(varImpMode = \"add\", RGBA(255,255,255,1), RGBA(45,58,64,1))\r\n            BorderThickness: =0\r\n            RadiusTopLeft: =18\r\n            RadiusTopRight: =18\r\n            RadiusBottomLeft: =18\r\n            RadiusBottomRight: =18\r\n            Font: =Font.'Open Sans'\r\n            FontWeight: =FontWeight.Semibold\r\n            Size: =12\r\n            OnSelect: =Set(varImpMode, \"add\"); Set(varImpArmed, false)\r\n            X: =610\r\n            Y: =122\r\n            Width: =130\r\n            Height: =36\r\n      - btnImpModeUpdate:\r\n          Control: Classic/Button@2.2.0\r\n          Properties:\r\n            Text: =\"Add + update by role\"\r\n            Fill: =If(varImpMode = \"update\", RGBA(0,78,66,1), RGBA(232,237,235,1))\r\n            HoverFill: =If(varImpMode = \"update\", RGBA(0,78,66,1), RGBA(222,229,226,1))\r\n            PressedFill: =Self.HoverFill\r\n            Color: =If(varImpMode = \"update\", RGBA(255,255,255,1), RGBA(45,58,64,1))\r\n            BorderThickness: =0\r\n            RadiusTopLeft: =18\r\n            RadiusTopRight: =18\r\n            RadiusBottomLeft: =18\r\n            RadiusBottomRight: =18\r\n            Font: =Font.'Open Sans'\r\n            FontWeight: =FontWeight.Semibold\r\n            Size: =12\r\n            OnSelect: =Set(varImpMode, \"update\"); Set(varImpArmed, false)\r\n            X: =750\r\n            Y: =122\r\n            Width: =210\r\n            Height: =36\r\n      - btnImpModeReplace:\r\n          Control: Classic/Button@2.2.0\r\n          Properties:\r\n            Text: =\"Replace\"\r\n            Fill: =If(varImpMode = \"replace\", RGBA(0,78,66,1), RGBA(232,237,235,1))\r\n            HoverFill: =If(varImpMode = \"replace\", RGBA(0,78,66,1), RGBA(222,229,226,1))\r\n            PressedFill: =Self.HoverFill\r\n            Color: =If(varImpMode = \"replace\", RGBA(255,255,255,1), RGBA(45,58,64,1))\r\n            BorderThickness: =0\r\n            RadiusTopLeft: =18\r\n            RadiusTopRight: =18\r\n            RadiusBottomLeft: =18\r\n            RadiusBottomRight: =18\r\n            Font: =Font.'Open Sans'\r\n            FontWeight: =FontWeight.Semibold\r\n            Size: =12\r\n            OnSelect: =Set(varImpMode, \"replace\"); Set(varImpArmed, false)\r\n            X: =970\r\n            Y: =122\r\n            Width: =130\r\n            Height: =36\r\n      - lblImpModeHint:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: |-\r\n              =Switch(\r\n                  varImpMode,\r\n                  \"add\", \"Adds anyone who is not already in the group. Never removes or changes anyone.\",\r\n                  \"update\", \"Adds new people. If a pasted name matches someone already in the group but with a different email, their email is updated instead of adding a second row.\",\r\n                  \"Makes each group match the paste exactly: adds new people and removes anyone who is not in the paste.\"\r\n              )\r\n            Color: =RGBA(96,105,103,1)\r\n            Size: =11\r\n            Font: =Font.'Open Sans'\r\n            X: =610\r\n            Y: =164\r\n            Width: =736\r\n            Height: =36\r\n      - recImpCard1:\r\n          Control: Classic/Button@2.2.0\r\n          Properties:\r\n            Text: =\"\"\r\n            DisplayMode: =DisplayMode.View\r\n            Visible: =CountRows(colImpTags) >= 1\r\n            Fill: =RGBA(255,255,255,1)\r\n            HoverFill: =Self.Fill\r\n            PressedFill: =Self.Fill\r\n            BorderColor: =RGBA(220,228,225,1)\r\n            BorderThickness: =1\r\n            RadiusTopLeft: =12\r\n            RadiusTopRight: =12\r\n            RadiusBottomLeft: =12\r\n            RadiusBottomRight: =12\r\n            X: =610\r\n            Y: r(Trim(Name)) in cur.NameKey)), 0),\r\n                              gone: If(varImpMode = \"replace\", CountRows(Filter(cur, !(Email in ents.Email))), 0)\r\n                          },\r\n                          If(\r\n                              IsBlank(title),\r\n                              \"Leave blank to skip this list.\",\r\n                              !exists,\r\n                              \"New group. \" & CountRows(ents) & \" people will be added.\",\r\n                              \"Existing group, \" & CountRows(cur) & \" now. \" & (CountRows(ents) - same - byRole) & \" new, \" & same & \" already there\" &\r\n                              If(byRole > 0, \", \" & byRole & \" email updates\", \"\") & If(gone > 0, \", \" & gone & \" to be removed\", \"\") & \".\"\r\n                          )\r\n                      )\r\n                  )\r\n              )\r\n            Visible: =CountRows(colImpTags) >= 6\r\n            Color: =RGBA(96,105,103,1)\r\n            Size: =11\r\n            Font: =Font.'Open Sans'\r\n            X: =800\r\n            Y: =609\r\n            Width: =538\r\n            Height: =20\r\n      - lblImpCapWarn:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: =\"Only the first 6 lists can be imported at once. Split the paste and import the rest separately.\"\r\n            Visible: =CountRows(colImpTags) > 6\r\n            Color: =RGBA(163,45,45,1)\r\n            FontWeight: =FontWeight.Bold\r\n            Size: =11\r\n            Font: =Font.'Open Sans'\r\n            X: =610\r\n            Y: =640\r\n            Width: =736\r\n            Height: =22\r\n      - btnImpGo:\r\n          Control: ModernButton@1.0.0\r\n          Properties:\r\n            Text: =If(varImpBusy, \"Importing... please wait\", If(varImpMode = \"replace\" && varImpArmed, \"Tap again to confirm replace\", \"Import now\"))\r\n            BasePaletteColor: =If(varImpMode = \"replace\", RGBA(163,45,45,1), RGBA(0,78,66,1))\r\n            DisplayMode: =If(varImpBusy || CountRows(colImpClean) = 0, DisplayMode.Disabled, DisplayMode.Edit)\r\n            OnSelect: |-\r\n              =With(\r\n                  {\r\n                      titled: CountRows(Filter(Sequence(CountRows(colImpTags)) As q, q.Value <= 6 && !IsBlank(Choose(q.Value, Trim(txtImpTitle1.Text), Trim(txtImpTitle2.Text), Trim(txtImpTitle3.Text), Trim(txtImpTitle4.Text), Trim(txtImpTitle5.Text), Trim(txtImpTitle6.Text))))),\r\n                      titles: Filter(ForAll(Sequence(CountRows(colImpTags)) As q, {T: Lower(Choose(q.Value, Trim(txtImpTitle1.Text), Trim(txtImpTitle2.Text), Trim(txtImpTitle3.Text), Trim(txtImpTitle4.Text), Trim(txtImpTitle5.Text), Trim(txtImpTitle6.Text)))}), !IsBlank(T))\r\n                  },\r\n                  If(\r\n                      varImpBusy,\r\n                      Blank(),\r\n                      CountRows(colImpClean) = 0,\r\n                      Notify(\"Check a paste first.\", NotificationType.Warning),\r\n                      titled = 0,\r\n                      Notify(\"Type a group name for at least one list.\", NotificationType.Warning),\r\n                      CountRows(titles) <> CountRows(Distinct(titles, T)),\r\n                      Notify(\"Two lists have the same group name. Give each list its own name.\", NotificationType.Warning),\r\n                      varImpMode = \"replace\" && !varImpArmed,\r\n                      Set(varImpArmed, true),\r\n                      Set(varImpBusy, true);\r\n                      Clear(colImpResults);\r\n                      ForAll(\r\n                          Sequence(CountRows(colImpTags)) As s,\r\n                          With(\r\n                              {title: Trim(Choose(s.Value, Trim(txtImpTitle1.Text), Trim(txtImpTitle2.Text), Trim(txtImpTitle3.Text), Trim(txtImpTitle4.Text), Trim(txtImpTitle5.Text), Trim(txtImpTitle6.Text)))},\r\n                              If(\r\n                                  s.Value <= 6 && !IsBlank(title) && CountRows(Filter(colGroups, Lower(Trim(Title)) = Lower(title))) = 0,\r\n                                  Patch('BM Groups', Defaults('BM Groups'), {Title: title, ThursdayBatch: {Value: \"None\"}, Private: false, OfficialSensitiveApproved: false, OfficialUseOnly: false});\r\n                                  Patch('BM History', Defaults('BM History'), {Title: \"Group created via import\", GroupName: title, EventType: {Value: \"Created\"}})\r\n                              )\r\n                          )\r\n                      );\r\n                      ClearCollect(colGroups, AddColumns(Sort('BM Groups', SortOrder, SortOrder.Ascending), Ticked, false));\r\n                      ForAll(\r\n                          Sequence(CountRows(colImpTags)) As s,\r\n                          With(\r\n                              {\r\n                                  tag: Index(colImpTags, s.Value).Tag,\r\n                                  typed: Trim(Choose(s.Value, Trim(txtImpTitle1.Text), Trim(txtImpTitle2.Text), Trim(txtImpTitle3.Text), Trim(txtImpTitle4.Text), Trim(txtImpTitle5.Text), Trim(txtImpTitle6.Text)))\r\n                              },\r\n                              If(\r\n                                  s.Value <= 6 && !IsBlank(typed),\r\n                                  With(\r\n                                      {gTitle: Coalesce(LookUp(colGroups, Lower(Trim(Title)) = Lower(typed)).Title, typed)},\r\n                                      With(\r\n                                          {\r\n                                              ents: Filter(colImpClean, Tag = tag),\r\n                                              cur: AddColumns(Filter(colMemberships, Lower(Trim(GroupName)) = Lower(gTitle)), NameKey, Lower(Trim(Name)))\r\n                                          },\r\n                                          With(\r\n                                              {\r\n                                                  toAdd: Filter(ents, !(Email in cur.Email) && !(varImpMode = \"update\" && Lower(Trim(Name)) in cur.NameKey)),\r\n                                                  toUpd: If(varImpMode = \"update\", Filter(ents, !(Email in cur.Email) && Lower(Trim(Name)) in cur.NameKey), Filter(ents, false)),\r\n                                                  toRem: If(varImpMode = \"replace\", Filter(cur, !(Email in ents.Email)), Filter(cur, false))\r\n                                              },\r\n                                              Collect(colImpResults, {Group: gTitle, Added: CountRows(toAdd), Updated: CountRows(toUpd), Removed: CountRows(toRem)});\r\n                                              ForAll(\r\n                                                  toRem As r,\r\n                                                  Remove('BM Memberships', LookUp('BM Memberships', ID = r.ID));\r\n                                                  RemoveIf(colMemberships, ID = r.ID)\r\n                                              );\r\n                                              ForAll(\r\n                                                  toUpd As e,\r\n                                                  With(\r\n                                                      {m: LookUp(cur, NameKey = Lower(Trim(e.Name)))},\r\n                                                      Patch('BM Memberships', LookUp('BM Memberships', ID = m.ID), {Email: e.Email});\r\n                                                      UpdateIf(colMemberships, ID = m.ID, {Email: e.Email})\r\n                                                  )\r\n                                              );\r\n                                              ForAll(\r\n                                                  toAdd As e,\r\n                                                  Collect(colMemberships, Patch('BM Memberships', Defaults('BM Memberships'), {Title: e.Name, Name: e.Name, Email: e.Email, GroupName: gTitle}))\r\n                                              );\r\n                                              Patch('BM History', Defaults('BM History'), {Title: \"Import via paste: \" & CountRows(toAdd) & \" added, \" & CountRows(toUpd) & \" updated, \" & CountRows(toRem) & \" removed\", GroupName: gTitle, EventType: {Value: Switch(varImpMode, \"replace\", \"Replaced\", \"update\", \"Edited\", \"Added\")}});\r\n                                              Patch('BM Groups', LookUp('BM Groups', Title = gTitle), {Title: gTitle})\r\n                                          )\r\n                                      )\r\n                                  )\r\n                              )\r\n                          )\r\n                      );\r\n                      Set(varImpBusy, false);\r\n                      Set(varImpArmed, false);\r\n                      Clear(colImpParsed);\r\n                      Clear(colImpClean);\r\n                      Clear(colImpTags);\r\n                      Reset(txtImportPaste);\r\n                      Notify(\"Import finished for \" & CountRows(colImpResults) & \" group\" & If(CountRows(colImpResults) = 1, \"\", \"s\") & \".\", NotificationType.Success)\r\n                  )\r\n              )\r\n            X: =610\r\n            Y: =650\r\n            Width: =300\r\n            Height: =46\r\n      - lblImpResult:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: |-\r\n              =If(\r\n                  CountRows(colImpResults) = 0,\r\n                  \"\",\r\n                  \"Last import: \" & Concat(colImpResults, Group & \" (\" & Added & \" added, \" & Updated & \" updated, \" & Removed & \" removed)\", \"; \")\r\n              )\r\n            Color: =RGBA(24,45,55,1)\r\n            Size: =11\r\n            Font: =Font.'Open Sans'\r\n            X: =610\r\n            Y: =704\r\n            Width: =736\r\n            Height: =52\r\n";
    const stamp = "2.50  \u2014  Built 24 Nov 2026  12:26 GMT Standard Time";

    function firstLines() {
      return yaml.split(/\r?\n/).slice(0, 8).join('\n');
    }

    async function copyYAML() {
      const status = document.getElementById('status');
      if (!yaml.startsWith('Screens:\r\n  ') && !yaml.startsWith('Screens:\n  ')) {
        status.textContent = 'Refusing to copy: YAML does not start with Screens:';
        status.className = 'err';
        return;
      }
      if (yaml.includes('\r\n    Control: Screen\r\n') || yaml.includes('\n    Control: Screen\n')) {
        status.textContent = 'Refusing to copy: stale YAML still contains screen-level Control: Screen.';
        status.className = 'err';
        return;
      }
      try {
        await navigator.clipboard.writeText(yaml);
        status.textContent = '✓ Copied ' + stamp + '. First YAML line: ' + yaml.split(/\r?\n/)[0];
        status.className = 'ok';
        setTimeout(() => {
          status.textContent = 'Click to copy again';
          status.className = '';
        }, 4000);
      } catch (e) {
        status.textContent = 'Clipboard blocked — select the text below and copy manually.';
        status.className = 'err';
        const pre = document.createElement('pre');
        pre.style = 'font-size:9px;max-height:200px;overflow:auto;background:#1a1a2e;padding:8px;border-radius:6px;text-align:left;';
        pre.textContent = yaml;
        document.body.appendChild(pre);
      }
    }

    document.getElementById('preview').textContent = 'Clipboard payload preview (' + stamp + ')\n' + firstLines();
  </script>
